name: Documentation issue
description: Report missing, unclear, or incorrect PADS guidance or examples.
title: "[Docs]: "
labels:
  - documentation
body:
  - type: input
    id: location
    attributes:
      label: Documentation location
      description: Link the page, Storybook story, README section, or package API.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Explain what is wrong, missing, inaccessible, or likely to cause incorrect consumer code.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe what a reader should understand or be able to complete.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Include package version, product context, or a suggested example when useful.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing documentation issues.
          required: true
        - label: Any example data is fictional and contains no credentials or private information.
          required: true
