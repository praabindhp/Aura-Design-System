version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 10
    versioning-strategy: increase-if-necessary
    groups:
      storybook:
        patterns:
          - "@storybook/*"
          - storybook
      testing:
        patterns:
          - "@playwright/*"
          - "@testing-library/*"
          - "@vitest/*"
          - vitest
      linting:
        patterns:
          - eslint
          - "eslint-*"
          - stylelint
          - "stylelint-*"
          - prettier
      react:
        patterns:
          - react
          - react-dom
          - "@types/react*"
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
